<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Driven Study Abroad Placements</title>
    <style>
        /* Your specific brand colors */
        :root {
            --bg-slate: #0F172A;
            --emerald: #10B981;
            --text-light: #F8FAFC;
        }
        
        body {
            background-color: var(--bg-slate);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            border: 1px solid #1E293B;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .highlight {
            color: var(--emerald);
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #94A3B8;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #1E293B;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: var(--emerald);
            color: var(--bg-slate);
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0d9668;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Secure Your <span class="highlight">Medical Future</span> Abroad</h1>
        <p>We help top FSc pre-medical students find guaranteed placements in internationally recognized medical universities.</p>
        
        <!-- A simple form setup -->
        <form action="#" method="POST">
            <input type="text" placeholder="Full Name" required>
            <input type="tel" placeholder="WhatsApp Number" required>
            <button type="submit">Get Your Free Evaluation</button>
        </form>
    </div>

</body>
</html>
